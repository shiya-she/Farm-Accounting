name: Build Android APK

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - debug
          - release
        default: 'debug'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install NativeScript CLI
        run: npm install -g @nativescript/cli

      - name: Build debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event_name != 'workflow_dispatch' }}
        run: ns build android --path .

      - name: Build release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          ns build android --release \
            --key-store-path ${{ secrets.KEYSTORE_PATH }} \
            --key-store-password ${{ secrets.KEYSTORE_PASSWORD }} \
            --key-store-alias ${{ secrets.KEYSTORE_ALIAS }} \
            --key-store-alias-password ${{ secrets.KEYSTORE_ALIAS_PASSWORD }} \
            --path .

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            platform/android/app/build/outputs/apk/debug/*.apk
            platform/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
